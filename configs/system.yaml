# Live3DGSAvatar —— 系统配置
#
# 本文件集中存放**路径类与设备类**配置；渲染参数见 configs/render.yaml。
# 字段说明见 docs/CONFIG.md。所有路径支持三种写法：
#   1. 绝对路径                     /home/you/Datasets/INSTA
#   2. 以 ~ 开头                     ~/Datasets/INSTA
#   3. 相对仓库根                    ../RGBAvatar
#
# 环境变量可覆盖任意字段（便于换机器 / CI 不改文件）：
#   LIVE3DGS_DATA_ROOT  → paths.data_root
#   LIVE3DGS_OUTPUT_DIR → paths.output_dir
#
# 用 `python scripts/show_config.py` 查看**解析后**的最终值。

# 人物名 / 工作名 —— 与 RGBAvatar 的 CLI 与目录约定完全一致。
#
#   * subject   人物名。既用于**数据集**（<data_root>/<subject>/），
#               也用于**模型**（<models_dir>/<subject>/<work_name>/）
#   * work_name 一次训练/导出的名字，参照里常用 `test`
#
# 参照实现与本项目用同一套名字解析各自的模型路径：
#   本项目 → <paths.models_dir>/<subject>/<work_name>/model.ply
#   参照   → <paths.reference_root>/output/<subject>/<work_name>/model.ply
#
# 切换对象只需改这两处（脚本的 --subject / --work-name 可临时覆盖）。
subject: duda
work_name: test

paths:
  # 数据集根目录。实际读取 <data_root>/<subject>/，
  # 其中需含 images/（原图）与 checkpoint/（3DMM 参数与相机）。
  data_root: /home/crh/Datasets/INSTA

  # 产物根目录。设置类脚本默认写到 <output_dir>/<脚本名>/
  # （例如 output_dir=output 时，渲染测试写 output/render_test/）。
  output_dir: output

  # 参照实现（RGBAvatar）仓库根目录，**只读**。
  # 用途：等价门与渲染测试从中读取 FLAME 模板、模板 UV、
  # 数据集读取代码，以及它自带的预训练模型。
  reference_root: /home/crh/Projects/RGBAvatar

  # 本项目自己的模型根目录。模型按 <models_dir>/<subject>/<work_name>/ 存放，
  # **与 RGBAvatar 的目录约定保持一致**，便于两边对照。
  models_dir: models

  # 显式指定模型文件。留空（null）表示按下面的顺序自动查找：
  #   1. <models_dir>/<subject>/<work_name>/model.ply             ← 本项目优先
  #   2. <reference_root>/output/<subject>/<work_name>/model.ply  ← 回退到参照
  # 若模型在别处，直接写绝对路径。
  #
  # 也可用 models_config 显式指定各模型随附的 config.yaml；
  # null 表示从上面的模型目录里读（RGBAvatar 在模型目录放了 config.yaml）。
  model_ply: null
  models_config: null

  # 渲染结果图（数据集原图）相对 <data_root>/<subject>/ 的子目录。
  # 用作 PSNR 的 GT。
  image_subdir: images

# 运行设备与精度。
runtime:
  device: cuda          # cuda | cpu（cpu 仅供不依赖 CUDA 内核的自检）
  split: all            # 参照数据集切分：all | train | test

# GPU 冒烟 / 渲染测试的采样规模上限。
# 帧数取 min(该值, 数据集实际帧数)；null 表示全部。
smoke:
  max_frames: null
